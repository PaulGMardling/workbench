name: Validate workbench
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/doctor.py
      - run: python -m unittest discover -s tests -v
      - run: python skills/fluent-a11y-diagnosis/scripts/evaluate.py
      - run: python skills/fluent-a11y-diagnosis/scripts/validate_report.py skills/fluent-a11y-diagnosis/examples/report.json
